name: e2e

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-jammy@sha256:167d0506cfbe3c294fb214b2d11737326eeee028aa611fa1ba538e5057675847
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Build API
        env:
          CGO_ENABLED: 1
        run: |
          apt-get update -q && apt-get install -yq --no-install-recommends gcc libc6-dev
          mkdir -p frontend/dist
          touch frontend/dist/index.html
          go build -tags osusergo -ldflags "-s -w" -o vikunja .

      - uses: ./.github/actions/setup-frontend

      - name: Build frontend
        working-directory: frontend
        run: pnpm build

      - name: Inject testing flag into index.html
        run: |
          sed -i 's/<head>/<head><script>window.TESTING=true;<\/script>/' ./frontend/dist/index.html

      - name: Run e2e tests
        working-directory: frontend
        run: |
          ../vikunja web > /tmp/vikunja.log 2>&1 &
          pnpm run preview > /tmp/preview.log 2>&1 &
          pnpx wait-on http-get://127.0.0.1:4173 http-get://127.0.0.1:3456/api/v1/info --timeout 60000
          pnpm run test:e2e \
            tests/e2e/project \
            tests/e2e/misc \
            tests/e2e/editor \
            tests/e2e/migrate \
            tests/e2e/task/comment-
        env:
          CI: 'true'
          PLAYWRIGHT_SKIP_VALIDATE_HOST_REQUIREMENTS: 1
          TEST_SECRET: averyLongSecretToSe33dtheDB
          VIKUNJA_SERVICE_TESTINGTOKEN: averyLongSecretToSe33dtheDB
          VIKUNJA_LOG_LEVEL: DEBUG
          VIKUNJA_CORS_ENABLE: 1
          VIKUNJA_SERVICE_PUBLICURL: http://127.0.0.1:3456
          VIKUNJA_DATABASE_PATH: memory
          VIKUNJA_DATABASE_TYPE: sqlite
          VIKUNJA_MAILER_ENABLED: 0
          VIKUNJA_RATELIMIT_NOAUTHLIMIT: 1000

      - name: Collect logs
        if: ${{ !cancelled() }}
        run: cp /tmp/vikunja.log /tmp/preview.log frontend/ || true

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-report
          path: |
            frontend/playwright-report/
            frontend/test-results/
            frontend/test-results.json
            frontend/vikunja.log
            frontend/preview.log
          retention-days: 30

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-results
          path: frontend/test-results.json
          retention-days: 30
